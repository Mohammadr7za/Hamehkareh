info:
  name: Confirm Otp
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/confirm-otp?otp=12345"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: otp
      value: "12345"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
