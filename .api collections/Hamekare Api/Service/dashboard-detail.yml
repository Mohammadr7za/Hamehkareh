info:
  name: dashboard-detail
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/dashboard-detail"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
