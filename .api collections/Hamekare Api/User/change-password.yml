info:
  name: change-password
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/change-password?new_password=11&old_password=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: new_password
      value: "11"
      type: query
    - name: old_password
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
