info:
  name: remove-file
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/remove-file"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
